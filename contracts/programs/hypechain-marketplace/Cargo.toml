[package]
name = "hypechain-marketplace"
version = "0.1.0"
description = "HypeChain NFT Marketplace Smart Contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hypechain_marketplace"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required for the `init_if_needed` constraint used by `list_evidence` to
# support relisting after delist. Re-init is gated on status + seller match
# inside the handler — see security-checklist §5b.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[dev-dependencies]
solana-program-test = "~1.18"
solana-sdk = "~1.18"
