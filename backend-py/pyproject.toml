[project]
name = "hypechain-backend"
version = "1.0.0"
description = "AI-Powered NFT Marketplace Backend with Solana Pay (FastAPI port)"
requires-python = ">=3.13"

# ALL runtime dependencies are declared up front in the scaffold PR so the
# parallel domain PRs (DSQL / Solana / AI+IPFS) never edit this file and never
# conflict on it. Each domain PR only adds code under its own directory.
dependencies = [
    # web framework + server + Lambda adapter
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mangum>=0.19",
    # validation + typed settings
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # structured logging (security headers set by an explicit middleware —
    # see app/middleware/security.py; no external header lib needed)
    "structlog>=24.4",
    # AI (OpenRouter via OpenAI SDK) + HTTP client (IPFS/NFT.Storage)
    "openai>=1.54",
    "httpx>=0.27",
    # Solana primitives + RPC + base58
    "solders>=0.21",
    "solana>=0.34",
    "base58>=2.1",
    # Aurora DSQL: async Postgres + ORM + AWS SDK (IAM auth token)
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "boto3>=1.35",
    # optional cache
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv]
package = false
