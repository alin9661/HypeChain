AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HypeChain backend — Express app deployed as a single AWS Lambda container
  image with a direct Function URL. No API Gateway (its 29s integration
  timeout cannot serve our 30–90s create-listing flow).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
# `sam deploy --guided` prompts for these on the first deploy and persists the
# non-secret answers to samconfig.toml. Secrets are NEVER stored in samconfig:
#   • Custodial wallet key — lives in AWS Secrets Manager, fetched at runtime by
#     the execution role (see HACKNYU_CUSTODIAL_* env below). Never a CF param,
#     never an env var, never on disk.
#   • API keys (OpenRouter, nft.storage, Helius) — NoEcho CF params passed at
#     deploy time via --parameter-overrides (NOT samconfig). NoEcho hides them
#     from describe-stacks; they land in the Lambda env at runtime (same exposure
#     as before). Moving these to runtime Secrets Manager fetch is a documented
#     fast-follow (needs an import-time fetch shim in openrouter.js / ipfs.js).
Parameters:

  # --- Required secrets (NoEcho, passed at deploy via --parameter-overrides) ---
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Description: OpenRouter API key — HACKNYU_OPENROUTER_API_KEY. Required (openrouter.js throws on import if missing).
  NftStorageApiKey:
    Type: String
    NoEcho: true
    Description: nft.storage API key — HACKNYU_NFT_STORAGE_API_KEY. Required (ipfs.js throws on import if missing).

  # --- Aurora DSQL (IAM-token auth, no static password) ---
  DsqlEndpoint:
    Type: String
    Description: >-
      Aurora DSQL cluster endpoint — HACKNYU_DSQL_ENDPOINT, e.g.
      <id>.dsql.us-east-1.on.aws. Required; pool.js throws if unset. Get it from
      `aws dsql get-cluster` after provisioning (plan Phase 3).
  DsqlRegion:
    Type: String
    Default: us-east-1
    Description: AWS region the DSQL cluster lives in — HACKNYU_DSQL_REGION. Used to mint the IAM auth token.
  DsqlDatabase:
    Type: String
    Default: postgres
    Description: DSQL database name — HACKNYU_DSQL_DATABASE. DSQL's default database is "postgres".
  DsqlClusterArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the DSQL cluster (arn:aws:dsql:<region>:<acct>:cluster/<id>). Scopes
      the dsql:DbConnectAdmin grant on the execution role. Empty = scope to all
      clusters in this account/region (fine for a single-cluster staging deploy).

  # --- Custodial signer (Secrets Manager runtime fetch; the money key) ---
  CustodialSecretId:
    Type: String
    Default: hypechain/server-wallet
    Description: >-
      Secrets Manager secret name/ARN holding the custodial wallet key —
      HACKNYU_CUSTODIAL_SECRET_ID. SecretString is either a raw base58 secret key
      or a JSON envelope {"privateKey":"<bs58>"}. Fetched at cold start by signer.js.
  CustodialKmsKeyArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the customer-managed KMS CMK that encrypts the custodial secret. Empty
      = the secret uses the AWS-managed aws/secretsmanager key (Secrets Manager
      decrypts transparently; no kms:Decrypt grant needed). Set this only if you
      provisioned a dedicated CMK (plan Phase 3 step 1).

  # --- Required config ---
  FrontendUrl:
    Type: String
    Default: https://hypechain.vercel.app
    Description: Production frontend origin — HACKNYU_FRONTEND_URL. Used by both Function URL CORS and Express CORS (fail-closed in prod).

  # --- Optional config (sensible defaults) ---
  SolanaRpcUrl:
    Type: String
    Default: https://api.devnet.solana.com
    Description: Solana RPC endpoint — HACKNYU_SOLANA_RPC_URL. Defaults to public devnet; upgrade to Helius/QuickNode for production load.
  DasRpcUrl:
    Type: String
    Default: https://api.devnet.solana.com
    Description: DAS-compatible RPC for compressed-NFT reads — HACKNYU_DAS_RPC_URL. Public devnet does NOT speak DAS; Helius/QuickNode required to read cNFTs.
  MarketplaceProgramId:
    Type: String
    Default: ''
    Description: Anchor marketplace program ID — HACKNYU_MARKETPLACE_PROGRAM_ID. Empty = listItemOnMarketplace stays stubbed (deferred to its own plan).
  MerkleTreeAddress:
    Type: String
    Default: ''
    Description: Bubblegum merkle tree address — HACKNYU_MERKLE_TREE_ADDRESS. Empty = code falls back to standard NFT minting (compressed mint disabled).
  PlatformCustodialWallet:
    Type: String
    Default: ''
    Description: Custodial wallet that holds NFTs for guest users — PLATFORM_CUSTODIAL_WALLET. Empty = wallet-only listings.

  # --- Throttling ---
  ReservedConcurrency:
    Type: Number
    Default: 20
    Description: >
      Reserved concurrency cap = the request throttle. App-level rate limiting
      was removed and there is no API Gateway (Function URL only, since API
      Gateway's 29s timeout cannot serve the 30–90s create-listing flow), so
      this is the throttle layer. Caps simultaneous invocations; excess requests
      are rejected with 429. Tune to your account's unreserved-concurrency budget.

  # --- Activity feed (Helius) — optional; feature degrades gracefully if unset ---
  HeliusWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Shared secret the Helius webhook sends in its Authorization header —
      HACKNYU_HELIUS_WEBHOOK_SECRET. Generate with `openssl rand -hex 32` and set
      the SAME value on the Helius webhook config. Empty = POST /api/webhooks/helius
      is fail-closed (rejects every request 401), so transfer events are not ingested.
  HeliusApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Helius API key (dashboard.helius.dev) — HACKNYU_HELIUS_API_KEY. Used only by
      the deferred DAS historical-backfill path; not required for live webhook ingest.

  # --- Waitlist (SES confirmation email + admin export) — optional ---
  WaitlistEmailsEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      HACKNYU_WAITLIST_EMAILS_ENABLED. 'true' makes POST /api/waitlist send a
      confirmation (to the signup) and a notification (to the admin) via SES.
      Both are best-effort — a send failure never fails the signup.
  SesSender:
    Type: String
    Default: ''
    Description: >-
      HACKNYU_SES_SENDER — a VERIFIED SES sender (email address or domain) used
      as the From address. Required when WaitlistEmailsEnabled=true. In the SES
      sandbox, recipients must also be verified until you request production access.
  WaitlistAdminEmail:
    Type: String
    Default: ''
    Description: HACKNYU_WAITLIST_ADMIN_EMAIL — address notified on each new signup.
  WaitlistExportToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      HACKNYU_WAITLIST_EXPORT_TOKEN — Bearer token guarding GET /api/waitlist/export.
      Generate with `openssl rand -hex 32`. Empty = the export endpoint fails
      closed (500), never open.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  # Scope dsql:DbConnectAdmin to a specific cluster ARN when provided; otherwise
  # to all clusters in this account/region (single-cluster staging default).
  HasDsqlClusterArn: !Not [!Equals [!Ref DsqlClusterArn, '']]
  # Add a kms:Decrypt grant only when a customer-managed CMK encrypts the secret.
  HasCustodialKmsKey: !Not [!Equals [!Ref CustodialKmsKeyArn, '']]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  HypeChainBackend:
    Type: AWS::Serverless::Function
    Properties:
      # Container image deployment — our deps exceed the 250 MB zip ceiling.
      # The image is built from ./Dockerfile (see Metadata block below) and
      # pushed to an ECR repo that SAM creates on first --guided deploy.
      PackageType: Image

      # Memory and timeout for the long-running create-listing flow:
      #   AI verify ~5–15s + image gen ~10–30s + IPFS ~5–15s + mint ~5–10s.
      # 1024 MB gives enough headroom for Metaplex Umi + Solana web3 deps to
      # warm up without OOM. 900s is Lambda's max timeout — we won't actually
      # hit it, but headroom protects us if the AI provider is slow.
      MemorySize: 1024
      Timeout: 900

      # arm64 (Lambda Graviton2) — native arch for Apple Silicon dev machines
      # (zero emulation overhead during `sam build`) and ~20% cheaper than
      # x86_64 at runtime. All native deps in this app (secp256k1, keccak,
      # bufferutil, bigint-buffer, utf-8-validate) ship arm64 Linux prebuilts
      # via prebuild-install / node-gyp-build, so there's no JIT-compile risk.
      Architectures:
        - arm64

      # Request throttle. App-level rate limiting was removed and there is no
      # API Gateway to host a usage plan, so a reserved-concurrency cap is the
      # throttle layer: it bounds simultaneous invocations (excess -> 429),
      # protecting OpenRouter/Solana-RPC/DSQL downstreams and capping cost.
      ReservedConcurrentExecutions: !Ref ReservedConcurrency

      # Execution role permissions. SAM auto-generates the role (keeping
      # AWSLambdaBasicExecutionRole for CloudWatch Logs) and merges these inline
      # statements. Least-privilege: only what the app touches at runtime.
      Policies:
        # Custodial key fetch at cold start (signer.js secretsmanager source).
        # Scoped to the hypechain/* secret namespace, not all secrets.
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadCustodialSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hypechain/*
        # Aurora DSQL connection as the admin user (pool.js mints a fresh
        # DbConnectAdmin IAM token per physical connection).
        - Version: '2012-10-17'
          Statement:
            - Sid: DsqlConnect
              Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !If
                - HasDsqlClusterArn
                - !Ref DsqlClusterArn
                - !Sub arn:aws:dsql:${DsqlRegion}:${AWS::AccountId}:cluster/*
        # kms:Decrypt — only when a customer-managed CMK encrypts the secret.
        # With the AWS-managed aws/secretsmanager key, Secrets Manager decrypts
        # transparently and this grant is unnecessary.
        - !If
          - HasCustodialKmsKey
          - Version: '2012-10-17'
            Statement:
              - Sid: DecryptCustodialSecret
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref CustodialKmsKeyArn
          - !Ref AWS::NoValue
        # SES for the waitlist route: a confirmation email to the user + an
        # admin notification per signup. SendRawEmail is forward-compat
        # (attachments/MIME); SendEmail covers the current plain-text sends.
        #
        # Resource is '*' on purpose. We tried scoping it to the verified sender
        # identity (arn:.../identity/<domain>) for least privilege, but SES
        # authorizes ses:SendEmail against the RECIPIENT identity too — in the
        # sandbox, sends go to verified identities, so a sender-scoped policy is
        # denied with "not authorized ... on resource identity/<recipient>". The
        # recipients are arbitrary public waitlist signups, so they can't be
        # enumerated in a policy. '*' is the only Resource that lets the feature
        # send. (Tighten later via SES sending authorization / a dedicated
        # configuration set, not an IAM Resource scope.)
        - Version: '2012-10-17'
          Statement:
            - Sid: WaitlistSesSend
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

      # Direct HTTPS endpoint, no API Gateway. AuthType NONE because we rely
      # on application-level wallet-signature verification, not AWS IAM auth.
      # CORS is owned solely by the Express `cors()` middleware (index.js). The
      # Function URL CORS layer is intentionally OMITTED: when both are active,
      # each response carries TWO Access-Control-Allow-Origin headers, which
      # browsers reject ("multiple values, only one allowed"). Express handles
      # preflight too (cors() mounted before routes), so nothing is lost.
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

      Environment:
        Variables:
          NODE_ENV: production
          # CORS allowlist — the single origin Express `cors()` allows. Express
          # CORS is fail-closed in production (index.js throws if this is unset).
          HACKNYU_FRONTEND_URL: !Ref FrontendUrl
          # --- Aurora DSQL (IAM-token auth; no password, no secret) ---
          HACKNYU_DSQL_ENDPOINT: !Ref DsqlEndpoint
          HACKNYU_DSQL_REGION: !Ref DsqlRegion
          HACKNYU_DSQL_DATABASE: !Ref DsqlDatabase
          # --- Custodial signer: fetch the key from Secrets Manager at cold
          # start (signer.js). The key NEVER lands in an env var. AWS_REGION is
          # auto-injected by the Lambda runtime, so signer.js reads it directly. ---
          HACKNYU_CUSTODIAL_KEY_SOURCE: secretsmanager
          HACKNYU_CUSTODIAL_SECRET_ID: !Ref CustodialSecretId
          # --- API keys (NoEcho params; passed at deploy, not in samconfig) ---
          HACKNYU_OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          HACKNYU_NFT_STORAGE_API_KEY: !Ref NftStorageApiKey
          # Chain / IPFS config — devnet defaults are fine for v1.
          HACKNYU_SOLANA_RPC_URL: !Ref SolanaRpcUrl
          HACKNYU_DAS_RPC_URL: !Ref DasRpcUrl
          HACKNYU_MARKETPLACE_PROGRAM_ID: !Ref MarketplaceProgramId
          HACKNYU_MERKLE_TREE_ADDRESS: !Ref MerkleTreeAddress
          PLATFORM_CUSTODIAL_WALLET: !Ref PlatformCustodialWallet
          # Activity feed — Helius transfer-indexing webhook (see Parameters).
          HACKNYU_HELIUS_WEBHOOK_SECRET: !Ref HeliusWebhookSecret
          HACKNYU_HELIUS_API_KEY: !Ref HeliusApiKey
          # CRITICAL: disable the Redis cache. cache.js gates its module-top
          # init on this flag (lines 11–16). With it set to "true", ioredis
          # would try to connect on every cold start and leak connections
          # across warm invocations — neither of which we want in Lambda.
          HACKNYU_REDIS_ENABLED: 'false'
          # Waitlist — SES confirmation email + admin export (see Parameters).
          # AWS_REGION is injected by the Lambda runtime; SES uses it automatically.
          HACKNYU_WAITLIST_EMAILS_ENABLED: !Ref WaitlistEmailsEnabled
          HACKNYU_SES_SENDER: !Ref SesSender
          HACKNYU_WAITLIST_ADMIN_EMAIL: !Ref WaitlistAdminEmail
          HACKNYU_WAITLIST_EXPORT_TOKEN: !Ref WaitlistExportToken

    # SAM uses these to build the container locally and push it to ECR.
    # `DockerContext: .` means the build context is backend/ (where this
    # file lives). DockerTag is just a label for ECR's image history.
    Metadata:
      DockerTag: nodejs20-v1
      DockerContext: .
      Dockerfile: Dockerfile

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
# After `sam deploy`, these print to the terminal. Copy FunctionUrl into the
# Vercel project's NEXT_PUBLIC_API_URL env var (BOTH Production and Preview
# scopes — see plan Risks section).
Outputs:
  FunctionUrl:
    Description: >
      Public HTTPS URL for the Lambda. Set this as NEXT_PUBLIC_API_URL on
      Vercel (Production + Preview scopes), then redeploy the frontend.
    # SAM auto-creates an AWS::Lambda::Url resource named "<FnLogicalId>Url"
    # when FunctionUrlConfig is set. Reference its FunctionUrl attribute.
    Value: !GetAtt HypeChainBackendUrl.FunctionUrl
  FunctionArn:
    Description: Lambda function ARN (useful for CloudWatch log queries).
    Value: !GetAtt HypeChainBackend.Arn
  EcrRepository:
    Description: ECR repo SAM created for this Lambda's container image.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/ecr/repositories
